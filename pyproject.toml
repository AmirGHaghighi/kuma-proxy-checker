[project]
name = "kuma-proxy-checker"
version = "0.1.0"
description = "Proxy health checker with per-proxy Uptime Kuma push reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "aiohttp>=3.9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/AmirGHaghighi/kuma-proxy-checker"
"Bug Tracker" = "https://github.com/AmirGHaghighi/kuma-proxy-checker/issues"

[project.scripts]
kuma-proxy-checker = "kuma_proxy_checker.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.nuitka]
entry-point = "__main__.py"
onefile = true
standalone = true
output-filename = "kuma-proxy-checker"
include-packages = [
    "kuma_proxy_checker",
    "pydantic", "pydantic_core", "httpx", "httpcore", "h11",
    "anyio", "certifi", "idna", "typing_extensions",
    "annotated_types", "typing_inspection",
    "aiohttp", "multidict", "yarl", "attrs", "frozenlist", "aiosignal"
]
include-data-files = { "config.example.json" = "config.example.json" }
lto = "no"
jobs = 4
windows-console-mode = "attach"