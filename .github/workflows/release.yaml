name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kuma-proxy-checker
          - os: windows-latest
            artifact: kuma-proxy-checker.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-key: ${{ runner.os }}-python-${{ hashFiles('pyproject.toml') }}
          cache-restore-keys: |
            ${{ runner.os }}-python-

      - name: Install mingw64 (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install mingw --version=15.2.0 --no-progress -y
          echo "C:\Program Files\mingw64\bin" >> $GITHUB_PATH

      - name: Install Nuitka
        run: pip install --quiet nuitka

      - name: Install project
        run: pip install --quiet -e .

      - name: Build with Nuitka (flags from pyproject.toml)
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              cfg = tomllib.load(f)

          n = cfg["tool"]["nuitka"]
          pkgs = n["include-packages"]
          data_files = list(n["include-data-files"].items())[0]

          flags = [
              "--onefile",
              "--standalone",
              *(f"--include-package={p}" for p in pkgs),
              f"--include-data-file={data_files[0]}={data_files[1]}",
              f"--lto={n['lto']}",
              f"--jobs={n['jobs']}",
              f"--output-filename=${{ matrix.artifact }}",
              "--assume-yes-for-downloads",
              n["entry-point"],
          ]

          print("Running:", " ".join(["python", "-m", "nuitka", *flags]), flush=True)
          env = os.environ.copy()
          env["PYTHONPATH"] = os.path.join(os.getcwd(), "src")
          sys.exit(subprocess.run(["python", "-m", "nuitka", *flags], env=env).returncode)

      - name: Verify binary
        run: |
          ./${{ matrix.artifact }} --version
          ./${{ matrix.artifact }} --help

      - name: Generate SHA256
        run: |
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          cat ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/kuma-proxy-checker
            artifacts/kuma-proxy-checker.exe
            artifacts/kuma-proxy-checker.sha256
            artifacts/kuma-proxy-checker.exe.sha256
            config.example.json
          generate_release_notes: true
