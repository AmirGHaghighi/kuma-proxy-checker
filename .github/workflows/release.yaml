name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kuma-proxy-checker
          - os: windows-latest
            artifact: kuma-proxy-checker.exe

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be131a38a7c9b4c5060e85a5307c6c745
        with:
          python-version: "3.11"
          cache: pip
          cache-key: ${{ runner.os }}-python-${{ hashFiles('pyproject.toml') }}
          cache-restore-keys: |
            ${{ runner.os }}-python-

      - name: Install mingw64 (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install mingw --version=15.2.0 --no-progress -y
          echo "C:\Program Files\mingw64\bin" >> $GITHUB_PATH

      - name: Install Nuitka
        run: pip install --quiet nuitka

      - name: Install project
        run: pip install --quiet -e .

      - name: Build with Nuitka (flags from pyproject.toml)
        shell: bash
        run: |
          python - <<'PY'
import json
import subprocess
import sys
import tomllib

with open("pyproject.toml", "rb") as f:
    cfg = tomllib.load(f)

n = cfg["tool"]["nuitka"]
pkgs = n["include-packages"]
data_files = list(n["include-data-files"].items())[0]

flags = [
    "--onefile",
    "--standalone",
    *(f"--include-package={p}" for p in pkgs),
    f"--include-data-file={data_files[0]}={data_files[1]}",
    f"--lto={n['lto']}",
    f"--jobs={n['jobs']}",
    f"--output-filename=${{ matrix.artifact }}",
    "--assume-yes-for-downloads",
    n["entry-point"],
]

print("Running:", " ".join(["python", "-m", "nuitka", *flags]), flush=True)
sys.exit(subprocess.run(["python", "-m", "nuitka", *flags]).returncode)
PY

      - name: Verify binary
        run: |
          ./${{ matrix.artifact }} --version
          ./${{ matrix.artifact }} --help

      - name: Generate SHA256
        run: |
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          cat ${{ matrix.artifact }}.sha256

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef2670da
        if: matrix.os == 'ubuntu-latest'
        with:
          files: |
            kuma-proxy-checker
            kuma-proxy-checker.exe
            kuma-proxy-checker.sha256
            kuma-proxy-checker.exe.sha256
          generate_release_notes: true